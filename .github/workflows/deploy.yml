name: Deploy to Heroku

# Every push to main deploys the app: Heroku builds the server + frontend
# (root package.json heroku-postbuild), runs `prisma migrate deploy` in the
# release phase, then boots web: node server/dist/server.js.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — Heroku rejects shallow pushes

      - name: Deploy to Heroku (git push → buildpack build)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote add heroku "https://heroku:${{ secrets.HEROKU_API_KEY }}@git.heroku.com/${{ secrets.HEROKU_APP_NAME }}.git"
          git push heroku HEAD:refs/heads/main --force
